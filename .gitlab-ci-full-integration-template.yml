# The CI job name will be unique after substitution from the generator.
include:
  - project: "Northern.tech/Mender/mendertesting"
    file: "qa-common/send-results-to-mantra.yml"
    ref: "master"

test:integration:$CI_NODE_INDEX:
  rules:
    - if: $RUN_TESTS_FULL_INTEGRATION == "true"
  image: docker:${DOCKER_VERSION}-dind
  stage: test
  tags:
    - mender-qa-worker-integration-tests
  # Healthy nodes finish in well under an hour (max observed ~77 min); cap hung
  # jobs (e.g. a test that blocks forever) at 2h instead of burning the full
  # default budget.
  timeout: 2h
  variables:
    # The backend composition comes from the mender-server submodule at
    # tests/mender_server; without this the compose files are simply absent and
    # every environment fails to start.
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_DEPTH: 1
  before_script:
    # These two variables would be set by GitLab CI "parallel" feature, and are used by our Pytest
    # plugin to split the tests among the CI jobs. They get substituted by the generator.
    - export CI_NODE_INDEX=$CI_NODE_INDEX
    - export CI_NODE_TOTAL=$CI_NODE_TOTAL
    - echo "$REGISTRY_MENDER_IO_PASSWORD" | docker login registry.mender.io --username "$REGISTRY_MENDER_IO_USERNAME" --password-stdin
    - echo "$DOCKER_HUB_PASSWORD" | docker login docker.io --username "$DOCKER_HUB_USERNAME" --password-stdin
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    # apk-requirements.txt carries skopeo, e2fsprogs-extra (debugfs) and iptables,
    # all of which conftest now checks for before collecting.
    - apk add $(cat ./tests/requirements-system/apk-requirements.txt)
    - apk add py3-virtualenv screen
    - python -m virtualenv /.venv
    - source /.venv/bin/activate
    # Integration keeps its own testutils, so its own requirements file is the
    # right one -- nothing here imports from the mender_server submodule, which
    # is used for its compose files only.
    - pip3 install -r ./tests/requirements-python/python-requirements.txt
    - pip3 install pyyaml
    # Fail early and loudly if the submodule did not come through.
    - test -f ./tests/mender_server/docker-compose.yml
      || { echo "mender_server submodule missing"; exit 1; }
    # Gitlab CI tends to set these DOCKER_ variables internally.
    # dind also creates the unix socket at /var/run/docker.sock
    - unset DOCKER_HOST DOCKER_TLS_VERIFY DOCKER_CERT_PATH
    # Run dockerd and wait it to start
    # https://github.com/krallin/tini#subreaping
    - screen -d -m /usr/bin/env TINI_SUBREAPER=true dockerd-entrypoint.sh
    - |
      MAX_WAIT=300
      while [ ${MAX_WAIT} -gt 0 ]; do
        echo "[$(date +%F_%T)] MAX_WAIT=${MAX_WAIT}"; ps # Debug information
        if docker version &>/dev/null; then
          docker version # Verify that the dockerd is up and running
          break
        fi
        MAX_WAIT=$((${MAX_WAIT} - 1))
        sleep 1
      done
      if test $MAX_WAIT -lt 1; then
        echo "Timeout waiting for docker to start"
        exit 1;
      fi
    # Increase system limits to make sure the tests are not limited while
    # running with high parallelism on a single VM
    - sysctl -w fs.inotify.max_user_instances=1024
    - sysctl -w fs.file-max=600000
    - ulimit -n 524288

  script:
    - cd tests
    - ./run.sh

  after_script:
    # Post results to Mantra
    - MANTRA_PROJECT_NAME=full_integration
    # Override CI_PIPELINE_SOURCE for the script to interpret this run as "nightly"
    - if [ "$PARENT_CI_PIPELINE_SOURCE" = "schedule" ]; then
    -   CI_PIPELINE_SOURCE=$PARENT_CI_PIPELINE_SOURCE
    -   CI_PIPELINE_ID=$PARENT_CI_PIPELINE_ID
    - fi
    - !reference [.mantra-push-results]

  artifacts:
    expire_in: 2w
    when: always
    paths:
      - tests/mender_test_logs
      - tests/results.xml
      - tests/report.html
    reports:
      junit: tests/results.xml
